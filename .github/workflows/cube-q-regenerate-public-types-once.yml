name: Cube Q Regenerate Exact Public Types Once

on:
  push:
    branches:
      - agent/cube-q-claim-review-inspection-decision

permissions:
  contents: write

jobs:
  regenerate-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Regenerate exact committed public database types
        run: |
          supabase gen types typescript --local --schema public > lib/supabase/database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          const path = "lib/supabase/database.types.ts";
          const content = fs.readFileSync(path, "utf8").replace(/\n*$/, "\n");
          fs.writeFileSync(path, content);
          NODE

      - name: Commit exact generated types
        run: |
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Public database types already match the schema."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "chore(db): regenerate public types for cube q"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
