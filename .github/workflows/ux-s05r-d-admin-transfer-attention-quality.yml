name: UX S05R D Admin Transfer Attention Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "app/operations/page.tsx"
      - "app/operations/transfers/page.tsx"
      - "components/transfers/transfer-hub.tsx"
      - "lib/transfers/receipt.server.ts"
      - "lib/navigation/operations-navigation.ts"
      - "scripts/verify-ux-s05r-a-center-workbench.mjs"
      - "scripts/verify-ux-s05r-b-partner-workbench.mjs"
      - "scripts/verify-ux-s05r-c-admin-workbench.mjs"
      - "scripts/verify-ux-s05r-d-admin-transfer-attention.mjs"
      - "scripts/verify-platform-role-reachability-ui.mjs"
      - ".github/workflows/ux-s05r-d-admin-transfer-attention-quality.yml"

permissions:
  contents: read

jobs:
  admin-transfer-attention-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify UX-S05R-D Admin Transfer attention contract
        run: node scripts/verify-ux-s05r-d-admin-transfer-attention.mjs

      - name: Verify UX-S05R-C Admin decision workbench regression
        run: node scripts/verify-ux-s05r-c-admin-workbench.mjs

      - name: Verify UX-S05R-B Partner workbench regression
        run: node scripts/verify-ux-s05r-b-partner-workbench.mjs

      - name: Verify UX-S05R-A Center workbench regression
        run: node scripts/verify-ux-s05r-a-center-workbench.mjs

      - name: Verify S03R role reachability contracts
        run: node scripts/verify-platform-role-reachability-ui.mjs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify build does not rewrite tracked configuration
        run: git diff --exit-code -- . ':!next-env.d.ts'
