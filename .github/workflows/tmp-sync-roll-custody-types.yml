name: Temporary Sync Roll Custody Types

"on":
  push:
    branches:
      - agent/roll-custody-final
    paths:
      - ".github/workflows/tmp-sync-roll-custody-types.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database
        run: supabase db reset --local --no-seed

      - name: Generate canonical database types
        run: supabase gen types typescript --local > lib/supabase/database.types.ts

      - name: Commit generated types when changed
        run: |
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Database types already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "Sync generated database types"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
