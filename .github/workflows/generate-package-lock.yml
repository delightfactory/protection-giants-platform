name: Generate package lock

"on":
  push:
    branches:
      - feature/supabase-production-readiness
    paths:
      - ".github/workflows/generate-package-lock.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout readiness branch
        uses: actions/checkout@v4
        with:
          ref: feature/supabase-production-readiness

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify only lockfile was generated
        run: |
          changed="$(git status --short)"
          echo "$changed"
          test "$changed" = "?? package-lock.json"

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock Node dependencies for reproducible installs"
          git push origin HEAD:feature/supabase-production-readiness
