name: Cube R one-shot Admin recovery types sync

on:
  push:
    branches:
      - agent/cube-r-claim-resolution-fulfillment

permissions:
  contents: write
  actions: read

jobs:
  sync-generated-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download qualified generated types artifact
        uses: actions/download-artifact@v4
        with:
          name: cube-r-generated-database-types-670d7516abfbda5dc850ef89e88f75f7b16d51f4
          path: .cube-r-types-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33063871388

      - name: Verify artifact and sync exact generated types
        shell: bash
        run: |
          set -euo pipefail
          test -f .cube-r-types-artifact/generated.database.types.ts
          echo '1d0aec20570095c6aa6e0676cbfcf4fb8807f43cbb7bc3d297541c8c4f0cfb0a  .cube-r-types-artifact/generated.database.types.ts' | sha256sum -c -
          cp .cube-r-types-artifact/generated.database.types.ts lib/supabase/database.types.ts
          rm -rf .cube-r-types-artifact
          git diff --check

      - name: Commit exact types and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-r-types-from-artifact.yml
          git add lib/supabase/database.types.ts
          git diff --cached --check
          git commit -m 'chore(cube-r): sync admin recovery database types'
          git push origin HEAD:${GITHUB_REF_NAME}
