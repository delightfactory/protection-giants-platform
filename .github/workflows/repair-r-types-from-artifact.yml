name: Cube R one-shot Admin read types sync

on:
  push:
    branches:
      - agent/cube-r-claim-resolution-fulfillment

permissions:
  contents: write
  actions: read

jobs:
  sync-generated-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download qualified generated types artifact
        uses: actions/download-artifact@v4
        with:
          name: cube-r-generated-database-types-7b8fb49fc9f6142749fad27ced0f6e14072c4660
          path: .cube-r-types-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33090096929

      - name: Verify artifact and sync exact generated types
        shell: bash
        run: |
          set -euo pipefail
          test -f .cube-r-types-artifact/generated.database.types.ts
          echo 'd6107cb0b9a731680cd65044fd9e9fa41f362ceee0539a65dc7572b5aca8bc56  .cube-r-types-artifact/generated.database.types.ts' | sha256sum -c -
          cp .cube-r-types-artifact/generated.database.types.ts lib/supabase/database.types.ts
          rm -rf .cube-r-types-artifact
          git diff --check

      - name: Commit exact types and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-r-types-from-artifact.yml
          git add lib/supabase/database.types.ts
          git diff --cached --check
          git commit -m 'chore(cube-r): sync admin read database types'
          git push origin HEAD:${GITHUB_REF_NAME}
