name: Repair Cube R generated types from qualified artifact

on:
  push:
    branches:
      - agent/cube-r-claim-resolution-fulfillment
    paths:
      - ".github/workflows/repair-r-types-from-artifact.yml"

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/cube-r-claim-resolution-fulfillment
          fetch-depth: 0

      - name: Download generated types from qualified Cube R run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/cube-r-types
          mkdir -p /tmp/cube-r-types
          gh run download 33015986222 \
            --repo delightfactory/protection-giants-platform \
            --name cube-r-generated-database-types-9f87a2524afc17eece5ca1af1f0cb6ea3f8c6cfc \
            --dir /tmp/cube-r-types
          test -f /tmp/cube-r-types/generated.database.types.ts
          echo "a5a2b0a8d9d4e29e2a815da147228b0e7557a40431ecb8b7ee59a98bc601abd1  /tmp/cube-r-types/generated.database.types.ts" | sha256sum -c -

      - name: Install exact generated types and remove one-shot workflow
        run: |
          cp /tmp/cube-r-types/generated.database.types.ts lib/supabase/database.types.ts
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'lib/supabase/database.types.ts';
          fs.writeFileSync(path, fs.readFileSync(path, 'utf8').replace(/\n*$/, '\n'));
          NODE
          rm .github/workflows/repair-r-types-from-artifact.yml

      - name: Commit canonical types and self-cleanup
        run: |
          git config user.name "delightfactory"
          git config user.email "assalama962@gmail.com"
          git add lib/supabase/database.types.ts .github/workflows/repair-r-types-from-artifact.yml
          git diff --cached --exit-code && { echo "Expected generated type drift was not present." >&2; exit 1; } || true
          git commit -m "chore(cube-r): sync generated types for roll reservation"
          git push origin HEAD:agent/cube-r-claim-resolution-fulfillment
