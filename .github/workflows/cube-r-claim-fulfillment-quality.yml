name: Cube R Claim Fulfillment Quality

# R is intentionally developed before its workflow exists on main, so branch
# pushes are the authoritative incremental gate while P/Q/R remain stacked.
# Current gate covers Product policy, Resolution state, assignment/corrections,
# replacement Roll allocation persistence, reserve/release lifecycle, bounded
# Production / Recovery / Cube K compatibility, consumption readiness/public
# terminal behavior, atomic normal assigned-Center completion for both remedies,
# bounded PD-079 post-assignment customer-withdrawal cancellation, the narrow
# Admin completion-recovery exception after assigned-Center capability loss,
# bounded Admin Resolution queue/detail plus replacement-Roll candidate reads,
# bounded assigned-Center fulfillment task queue/detail/evidence reads with
# immediate reassignment revocation and no customer PII/Admin-allocation internals,
# the server-only assigned-Center completion evidence/upload/mutation boundary,
# the server-only Admin assignment/correction/reserve/release mutation boundary,
# the server-only PD-079 customer-withdrawal cancellation boundary,
# recovery-only Admin evidence staging plus idempotent recovery completion boundary,
# Inbox-only Company/Admin materialization for normal/recovery completion events,
# and the Admin Resolution queue/detail/action UI wired only to qualified boundaries.
# Canonical generated DB types, including completion/cancellation/recovery/read RPC
# surfaces, are part of the same-HEAD qualification contract.
on:
  push:
    branches:
      - agent/cube-r-claim-resolution-fulfillment
    paths:
      - "supabase/migrations/*cube_r*"
      - "scripts/verify-cube-r-claim-*.mjs"
      - "lib/supabase/database.types.ts"
      - "app/operations/claim-resolutions/**"
      - "app/operations/page.tsx"
      - "components/claims/**"
      - ".github/workflows/cube-r-claim-fulfillment-quality.yml"
      - "docs/cube-r-claim-resolution-replacement-reinstall-spec.md"
      - "docs/claims-pqr-final-spec-review-amendment.md"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/*cube_r*"
      - "scripts/verify-cube-r-claim-*.mjs"
      - "lib/supabase/database.types.ts"
      - "app/operations/claim-resolutions/**"
      - "app/operations/page.tsx"
      - "components/claims/**"
      - ".github/workflows/cube-r-claim-fulfillment-quality.yml"
      - "docs/cube-r-claim-resolution-replacement-reinstall-spec.md"
      - "docs/claims-pqr-final-spec-review-amendment.md"

permissions:
  contents: read

concurrency:
  group: cube-r-claim-fulfillment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claim-fulfillment-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local --level warning --fail-on error

      - name: Create bounded Product / Center / Warranty fixtures
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-roll-opening-foundation.mjs
          node scripts/verify-warranty-schema-foundation.mjs
          node scripts/verify-warranty-activation-engine.mjs

      - name: Verify Cube P intake regression
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-p-claim-intake.mjs

      - name: Verify Cube Q review / inspection / decision regression
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-q-claim-review.mjs

      - name: Verify Cube R replacement Product policy boundary
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-product-policy.mjs

      - name: Verify Cube R Resolution persistence/state foundation
        run: node scripts/verify-cube-r-claim-resolution-foundation.mjs

      - name: Verify Cube R initial Resolution assignment
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-initial-assignment.mjs

      - name: Verify Cube R replacement Roll allocation persistence
        run: node scripts/verify-cube-r-claim-roll-allocation-foundation.mjs

      - name: Verify Cube R reassignment and remedy correction
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-assignment-corrections.mjs

      - name: Verify Cube R replacement Roll reservation lifecycle
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-roll-reservation-lifecycle.mjs

      - name: Verify Cube N public Warranty resolver regression
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-n-public-warranty-resolver.mjs

      - name: Verify Cube R material-domain compatibility
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-material-domain-compatibility.mjs

      - name: Verify Cube R consumption readiness and consumed public terminal state
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-consumption-readiness.mjs

      - name: Verify Cube R atomic normal Center completion
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-normal-center-completion.mjs

      - name: Verify Cube R PD-079 customer withdrawal cancellation
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-customer-withdrawal.mjs

      - name: Verify Cube R PD-079 withdrawal server action
        run: node scripts/verify-cube-r-claim-withdrawal-action.mjs

      - name: Verify Cube R narrow Admin recovery completion
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-admin-recovery-completion.mjs

      - name: Verify Cube R Admin recovery server actions
        run: node scripts/verify-cube-r-claim-admin-recovery-actions.mjs

      - name: Verify Cube R completion notification materialization
        run: node scripts/verify-cube-r-claim-completion-notifications.mjs

      - name: Verify Cube R Admin Resolution operational reads
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-admin-resolution-reads.mjs

      - name: Verify Cube R Admin mutation server actions
        run: node scripts/verify-cube-r-claim-admin-mutation-actions.mjs

      - name: Verify Cube R Admin Resolution UI contract
        run: node scripts/verify-cube-r-claim-admin-resolution-ui.mjs

      - name: Verify Cube R Center assigned-task operational reads
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-r-claim-center-resolution-reads.mjs

      - name: Verify Cube R Center completion server actions
        run: node scripts/verify-cube-r-claim-center-completion-actions.mjs

      - name: Generate public database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          const path = "/tmp/generated.database.types.ts";
          fs.writeFileSync(path, fs.readFileSync(path, "utf8").replace(/\n*$/, "\n"));
          NODE

      - name: Upload generated database types
        uses: actions/upload-artifact@v4
        with:
          name: cube-r-generated-database-types-${{ github.sha }}
          path: /tmp/generated.database.types.ts
          if-no-files-found: error
          retention-days: 1

      - name: Verify generated public database types are committed exactly
        run: |
          cp lib/supabase/database.types.ts /tmp/committed.database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          const path = "/tmp/committed.database.types.ts";
          fs.writeFileSync(path, fs.readFileSync(path, "utf8").replace(/\n*$/, "\n"));
          NODE
          diff -u /tmp/committed.database.types.ts /tmp/generated.database.types.ts

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Verify build does not rewrite tracked configuration
        run: git diff --exit-code -- . ':!next-env.d.ts'

      - name: Stop local stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
