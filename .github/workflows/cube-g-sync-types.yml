name: Cube G Type Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}
      - name: Start local Supabase
        run: supabase start
      - name: Generate types and apply final interaction polish
        shell: bash
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          const generated = fs.readFileSync("/tmp/generated.database.types.ts", "utf8").replace(/\n*$/, "\n");
          fs.writeFileSync("lib/supabase/database.types.ts", generated);

          const path = "components/transfers/transfer-send-flow.tsx";
          let source = fs.readFileSync(path, "utf8");

          const stateNeedle = `  const [pendingLot, setPendingLot] = useState<ExpandedLot | null>(null);\n  const [recipientChangePending, setRecipientChangePending] = useState(false);\n\n  const [manualSerial, setManualSerial] = useState(\"\");`;
          const stateReplacement = `  const [pendingLot, setPendingLot] = useState<ExpandedLot | null>(null);\n  const [recipientChangePending, setRecipientChangePending] = useState(false);\n  const [clearSelectionPending, setClearSelectionPending] = useState(false);\n\n  const [manualSerial, setManualSerial] = useState(\"\");`;
          if (!source.includes(stateNeedle) && !source.includes("clearSelectionPending")) throw new Error("Clear-selection state anchor not found.");
          source = source.replace(stateNeedle, stateReplacement);

          const buttonNeedle = `                <button type=\"button\" className=\"button button-ghost\" onClick={() => {\n                  if (window.confirm(\"مسح كل اللفات المحددة من هذا التحويل؟\")) clearSelection();\n                }}>مسح الكل</button>`;
          const buttonReplacement = `                <button type=\"button\" className=\"button button-ghost\" onClick={() => setClearSelectionPending(true)}>مسح الكل</button>`;
          if (!source.includes(buttonNeedle) && source.includes("window.confirm")) throw new Error("Native confirm anchor not found.");
          source = source.replace(buttonNeedle, buttonReplacement);

          const endNeedle = `      {recipientChangePending ? (\n        <div className={styles.decisionBackdrop} role=\"presentation\">\n          <section className={styles.decisionSheet} role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"change-recipient-title\">\n            <p className={styles.stepLabel}>تغيير وجهة التحويل</p>\n            <h2 id=\"change-recipient-title\">تغيير المستلم مع وجود لفات محددة؟</h2>\n            <p>لأن الوجهة تغيرت، لن نحتفظ باختيار جاهز للإرسال إلى مستلم آخر بشكل صامت. سيتم مسح اللفات الحالية ثم تعود لتحديد المستلم.</p>\n            <div className={styles.decisionActions}>\n              <button type=\"button\" className=\"button button-primary\" onClick={() => {\n                clearSelection();\n                resetRecipient();\n              }}>تغيير المستلم ومسح الاختيار</button>\n              <button type=\"button\" className=\"button button-ghost\" onClick={() => setRecipientChangePending(false)}>الاحتفاظ بالمستلم</button>\n            </div>\n          </section>\n        </div>\n      ) : null}\n    </div>`;
          const endReplacement = `      {recipientChangePending ? (\n        <div className={styles.decisionBackdrop} role=\"presentation\">\n          <section className={styles.decisionSheet} role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"change-recipient-title\">\n            <p className={styles.stepLabel}>تغيير وجهة التحويل</p>\n            <h2 id=\"change-recipient-title\">تغيير المستلم مع وجود لفات محددة؟</h2>\n            <p>لأن الوجهة تغيرت، لن نحتفظ باختيار جاهز للإرسال إلى مستلم آخر بشكل صامت. سيتم مسح اللفات الحالية ثم تعود لتحديد المستلم.</p>\n            <div className={styles.decisionActions}>\n              <button type=\"button\" className=\"button button-primary\" onClick={() => {\n                clearSelection();\n                resetRecipient();\n              }}>تغيير المستلم ومسح الاختيار</button>\n              <button type=\"button\" className=\"button button-ghost\" onClick={() => setRecipientChangePending(false)}>الاحتفاظ بالمستلم</button>\n            </div>\n          </section>\n        </div>\n      ) : null}\n\n      {clearSelectionPending ? (\n        <div className={styles.decisionBackdrop} role=\"presentation\">\n          <section className={styles.decisionSheet} role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"clear-selection-title\">\n            <p className={styles.stepLabel}>الاختيار الحالي</p>\n            <h2 id=\"clear-selection-title\">مسح كل اللفات المحددة؟</h2>\n            <p>سيتم إلغاء الاختيار الحالي فقط. لن يتم إنشاء أو إلغاء أي تحويل في قاعدة البيانات.</p>\n            <div className={styles.decisionActions}>\n              <button type=\"button\" className=\"button button-primary\" onClick={() => {\n                clearSelection();\n                setClearSelectionPending(false);\n              }}>مسح {selectedCount.toLocaleString(\"en-US\")} لفة</button>\n              <button type=\"button\" className=\"button button-ghost\" onClick={() => setClearSelectionPending(false)}>الاحتفاظ بالاختيار</button>\n            </div>\n          </section>\n        </div>\n      ) : null}\n    </div>`;
          if (!source.includes(endNeedle) && !source.includes("clear-selection-title")) throw new Error("Decision-sheet anchor not found.");
          source = source.replace(endNeedle, endReplacement);

          fs.writeFileSync(path, source);
          NODE

          if git diff --quiet -- lib/supabase/database.types.ts components/transfers/transfer-send-flow.tsx; then
            echo "Generated types and interaction polish are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/supabase/database.types.ts components/transfers/transfer-send-flow.tsx
            git commit -m "chore: synchronize Cube G types and interaction polish"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
