name: Cube G Type Sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}
      - name: Start local Supabase
        run: supabase start
      - name: Generate and commit exact public types
        shell: bash
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          const path = "/tmp/generated.database.types.ts";
          const content = fs.readFileSync(path, "utf8").replace(/\n*$/, "\n");
          fs.writeFileSync("lib/supabase/database.types.ts", content);
          NODE
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Generated types are already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/supabase/database.types.ts
            git commit -m "chore: synchronize Cube G database types"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
