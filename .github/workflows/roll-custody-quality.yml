name: Roll Custody Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260813234500_roll_custody_foundation.sql"
      - "supabase/migrations/20260813235000_roll_custody_rls_hardening.sql"
      - "supabase/migrations/20260813235500_roll_custody_roll_projection.sql"
      - "supabase/migrations/20260813235600_roll_custody_private_audit.sql"
      - "supabase/migrations/20260813235700_roll_custody_roll_rls.sql"
      - "supabase/migrations/20260813235800_roll_custody_current_view.sql"
      - "scripts/setup-roll-custody-fixture.mjs"
      - "scripts/verify-roll-custody-public.mjs"
      - "scripts/verify-roll-custody-private.sql"
      - ".github/workflows/roll-custody-quality.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Verify Roll custody public contracts
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/setup-roll-custody-fixture.mjs
          node scripts/verify-roll-custody-public.mjs

      - name: Verify private custody audit contracts
        run: |
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres < scripts/verify-roll-custody-private.sql

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
