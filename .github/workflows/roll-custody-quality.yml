name: Roll Custody Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20260813234500_roll_custody_foundation.sql"
      - "supabase/migrations/20260813235000_roll_custody_rls_hardening.sql"
      - "scripts/verify-roll-custody-foundation.mjs"
      - ".github/workflows/roll-custody-quality.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Verify Roll custody contracts
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-roll-custody-foundation.mjs

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
