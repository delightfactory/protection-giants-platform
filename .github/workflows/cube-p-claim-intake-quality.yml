name: Cube P Claim Intake Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "lib/warranty/claim-*.ts"
      - "scripts/verify-cube-p-claim-*.mjs"
      - ".github/workflows/cube-p-claim-intake-quality.yml"

permissions:
  contents: write

jobs:
  apply-customer-context-privacy-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove internal Warranty UUID from serialized customer context
        run: |
          python3 <<'PY'
          from pathlib import Path

          domain_path = Path("lib/warranty/claim-intake.ts")
          domain = domain_path.read_text()
          marker = "export type CustomerWarrantyClaimContext = {\n"
          if marker not in domain:
              raise SystemExit("Customer context type marker missing.")
          before, after = domain.split(marker, 1)
          uuid_line = "  warrantyId: string;\n"
          if uuid_line not in after:
              raise SystemExit("Customer-facing Warranty UUID field missing from expected type.")
          after = after.replace(uuid_line, "", 1)
          domain_path.write_text(before + marker + after)

          access_path = Path("lib/warranty/claim-access.server.ts")
          access = access_path.read_text()
          mapper_marker = "function toCustomerContext(row: ClaimContextRow): CustomerWarrantyClaimContext {"
          if mapper_marker not in access:
              raise SystemExit("Customer context mapper marker missing.")
          before_mapper, mapper = access.split(mapper_marker, 1)
          mapper_uuid = "    warrantyId: row.warranty_id,\n"
          if mapper_uuid not in mapper:
              raise SystemExit("Serialized Warranty UUID mapper field missing.")
          mapper = mapper.replace(mapper_uuid, "", 1)
          access_path.write_text(before_mapper + mapper_marker + mapper)

          test_path = Path("scripts/verify-cube-p-claim-client-contract.mjs")
          test = test_path.read_text()
          anchor = '''assert(access.includes("draftId") && access.includes("publicCodeHash"),\n  "Short-lived Claim context must bind both staged evidence namespace and permanent Warranty identity without storing raw Public Code.");\n'''
          addition = '''assert(access.includes("draftId") && access.includes("publicCodeHash"),\n  "Short-lived Claim context must bind both staged evidence namespace and permanent Warranty identity without storing raw Public Code.");\nconst customerContextType = domain.slice(\n  domain.indexOf("export type CustomerWarrantyClaimContext"),\n  domain.indexOf("export type WarrantyClaimVerificationResult"),\n);\nconst customerContextMapper = access.slice(\n  access.indexOf("function toCustomerContext"),\n  access.indexOf("async function cleanupExpiredClaimDrafts"),\n);\nassert(!customerContextType.includes("warrantyId") && !customerContextMapper.includes("warrantyId:"),\n  "Customer-facing verified Claim context must not serialize the internal Warranty UUID; server authorization keeps it only in the signed payload/server RPC boundary.");\nassert(!claimClient.includes("warrantyId"),\n  "Customer Claim client must not depend on or expose the internal Warranty UUID.");\n'''
          if anchor not in test:
              raise SystemExit("Expected privacy-test anchor missing.")
          test_path.write_text(test.replace(anchor, addition, 1))
          PY

      - name: Commit customer context privacy correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/warranty/claim-intake.ts lib/warranty/claim-access.server.ts scripts/verify-cube-p-claim-client-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Cube P: keep Warranty UUID server-only"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
