name: Cube P Claim Intake Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "app/(public)/w/**"
      - "scripts/verify-cube-p-claim-*.mjs"
      - ".github/workflows/cube-p-claim-intake-quality.yml"

permissions:
  contents: write

jobs:
  apply-customer-submit-privacy-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove internal Claim UUID from Server Action response
        run: |
          python3 <<'PY'
          from pathlib import Path

          actions_path = Path("app/(public)/w/[publicCode]/claim/actions.ts")
          actions = actions_path.read_text()
          old = "return { ok: true, claimId: row.claim_id, claimNumber: row.claim_number };"
          count = actions.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly two customer Claim success responses with claimId, found {count}.")
          actions_path.write_text(actions.replace(old, "return { ok: true, claimNumber: row.claim_number };"))

          test_path = Path("scripts/verify-cube-p-claim-client-contract.mjs")
          test = test_path.read_text()
          anchor = '''assert(!claimClient.includes("warrantyId"),\n  "Customer Claim client must not depend on or expose the internal Warranty UUID.");\n'''
          addition = anchor + '''const customerSubmitResultType = domain.slice(\n  domain.indexOf("export type WarrantyClaimSubmitResult"),\n  domain.indexOf("export function isWarrantyClaimCategory"),\n);\nconst customerSubmitAction = actions.slice(actions.indexOf("export async function submitWarrantyClaim"));\nassert(!customerSubmitResultType.includes("claimId") && !customerSubmitAction.includes("claimId:"),\n  "Customer Claim submission result must expose only the stable non-secret Claim Number, never the internal Claim UUID.");\n'''
          if anchor not in test:
              raise SystemExit("Customer privacy static-test anchor missing.")
          test_path.write_text(test.replace(anchor, addition, 1))
          PY

      - name: Commit customer submit privacy correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(public)/w/[publicCode]/claim/actions.ts' scripts/verify-cube-p-claim-client-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Cube P: keep Claim UUID server-only"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
