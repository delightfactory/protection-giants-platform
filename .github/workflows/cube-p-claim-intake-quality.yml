name: Cube P Claim Intake Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "app/(public)/w/**"
      - "scripts/verify-cube-p-claim-*.mjs"
      - ".github/workflows/cube-p-claim-intake-quality.yml"

permissions:
  contents: write

jobs:
  apply-lost-response-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove projection precheck from final submit and pin regression guard
        run: |
          python3 <<'PY'
          from pathlib import Path

          actions_path = Path("app/(public)/w/[publicCode]/claim/actions.ts")
          actions = actions_path.read_text()
          marker = "export async function submitWarrantyClaim"
          before, submit = actions.split(marker, 1)
          stale_gate = '  if (!access.context.canSubmitNewClaim) return { ok: false, code: "PG_CLAIM_NOT_SUBMITTABLE" };\n'
          if stale_gate not in submit:
              raise SystemExit("Expected final-submit projection gate was not found.")
          submit = submit.replace(stale_gate, "", 1)
          actions_path.write_text(before + marker + submit)

          test_path = Path("scripts/verify-cube-p-claim-client-contract.mjs")
          test = test_path.read_text()
          anchor = '''assert(actions.includes("p_warranty_id: access.payload.warrantyId"),\n  "Final Claim submit must take Warranty ownership only from the signed server context, not customer input.");\n'''
          addition = '''assert(actions.includes("p_warranty_id: access.payload.warrantyId"),\n  "Final Claim submit must take Warranty ownership only from the signed server context, not customer input.");\n\nconst finalSubmitSource = actions.slice(actions.indexOf("export async function submitWarrantyClaim"));\nassert(!finalSubmitSource.includes("if (!access.context.canSubmitNewClaim)"),\n  "Final submit must not trust the read projection as an eligibility gate; same-request lost-response retries must always reach the authoritative DB idempotency boundary.");\nassert(finalSubmitSource.includes('admin.rpc("create_customer_warranty_claim"'),\n  "Final submit must continue through the authoritative idempotent Claim mutation after fresh phone-context validation.");\n'''
          if anchor not in test:
              raise SystemExit("Expected Cube P static-test anchor was not found.")
          test_path.write_text(test.replace(anchor, addition, 1))
          PY

      - name: Commit bounded retry correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/(public)/w/[publicCode]/claim/actions.ts' scripts/verify-cube-p-claim-client-contract.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Cube P: preserve idempotent lost-response retries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
