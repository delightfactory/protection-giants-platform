name: Cube P Claim Intake Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/cube-p-claim-intake-quality.yml"

permissions:
  contents: write

jobs:
  apply-cleanup-locking-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Fix PostgreSQL SELECT clause order exactly
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("supabase/migrations/20260825232000_cube_p_claim_evidence_staging_registry.sql")
          text = path.read_text()
          old = """    order by draft.expires_at, draft.id
    for update skip locked
    limit p_limit
"""
          new = """    order by draft.expires_at, draft.id
    limit p_limit
    for update skip locked
"""
          if old not in text:
              raise SystemExit("Expected cleanup SELECT clause order was not found exactly.")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit exact migration correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260825232000_cube_p_claim_evidence_staging_registry.sql
          git diff --cached --quiet && exit 0
          git commit -m "Cube P: correct stale cleanup locking syntax"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
