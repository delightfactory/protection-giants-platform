name: Cube P Claim Intake Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "scripts/verify-cube-p-claim-races.mjs"
      - "lib/supabase/database.types.ts"
      - ".github/workflows/cube-p-claim-intake-quality.yml"

permissions:
  contents: write

jobs:
  bootstrap-final-qualification-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Add missing race assertion helper
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("scripts/verify-cube-p-claim-races.mjs")
          text = path.read_text()
          if "async function expectRpcError(" not in text:
              anchor = '''async function rpc(name, body, token = serviceRoleKey, key = serviceRoleKey) {\n  return request(`/rest/v1/rpc/${name}`, { method: "POST", body, token, key });\n}\n'''
              helper = anchor + '''\nasync function expectRpcError(name, body, expected, token = serviceRoleKey, key = serviceRoleKey) {\n  const result = await rpc(name, body, token, key);\n  assert(!result.response.ok, `${name} unexpectedly succeeded; expected ${expected}.`);\n  assert(result.body?.message === expected,\n    `${name} expected ${expected}, got ${result.response.status} ${JSON.stringify(result.body)}`);\n  return result;\n}\n'''
              if anchor not in text:
                  raise SystemExit("Race RPC helper insertion anchor missing.")
              path.write_text(text.replace(anchor, helper, 1))
          PY

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Generate exact database types
        run: |
          supabase gen types typescript --local --schema public > lib/supabase/database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          const path = "lib/supabase/database.types.ts";
          const content = fs.readFileSync(path, "utf8").replace(/\n*$/, "\n");
          fs.writeFileSync(path, content);
          NODE

      - name: Commit bounded generated inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-cube-p-claim-races.mjs lib/supabase/database.types.ts
          git diff --cached --quiet && exit 0
          git commit -m "Cube P: fix race verifier and sync generated types"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Stop local stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
