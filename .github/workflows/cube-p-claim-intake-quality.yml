name: Cube P Claim Intake Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "app/(public)/w/**"
      - "lib/warranty/claim-*.ts"
      - "lib/supabase/database.types.ts"
      - "scripts/verify-cube-p-claim-*.mjs"
      - ".github/workflows/cube-p-claim-intake-quality.yml"
      - "docs/cube-p-customer-warranty-claim-intake-spec.md"
      - "docs/claims-pqr-final-spec-review-amendment.md"

permissions:
  contents: read

jobs:
  claim-intake-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Verify Cube P client/security contracts
        run: node scripts/verify-cube-p-claim-client-contract.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local --level warning --fail-on error

      - name: Create bounded existing-domain fixtures
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-roll-opening-foundation.mjs
          node scripts/verify-warranty-schema-foundation.mjs
          node scripts/verify-warranty-activation-engine.mjs

      - name: Verify Cube P database / privacy / lifecycle contracts
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-p-claim-intake.mjs

      - name: Verify Cube P pre-merge hardening contracts
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-p-claim-hardening.mjs

      - name: Verify Cube P phone throttle active-block precedence
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-p-phone-throttle-window.mjs

      - name: Verify Cube P concurrency and idempotency races
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-p-claim-races.mjs

      - name: Verify generated database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          for (const path of ["/tmp/generated.database.types.ts", "lib/supabase/database.types.ts"]) {
            const content = fs.readFileSync(path, "utf8").replace(/\n*$/, "\n");
            fs.writeFileSync(path, content);
          }
          NODE
          diff -u lib/supabase/database.types.ts /tmp/generated.database.types.ts

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Verify build does not rewrite tracked configuration
        run: git diff --exit-code -- . ':!next-env.d.ts'

      - name: Stop local stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
