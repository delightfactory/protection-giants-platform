name: UX S06R C Admin Resolution Hierarchy Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "app/operations/claim-resolutions/[id]/page.tsx"
      - "app/operations/claim-resolutions/[id]/resolution-detail.module.css"
      - "components/claims/admin-claim-resolution-actions.tsx"
      - "scripts/verify-ux-s06r-c-admin-resolution-hierarchy.mjs"
      - "scripts/verify-cube-r-claim-admin-resolution-ui.mjs"
      - "scripts/verify-ux-s06r-a-center-admin-density.mjs"
      - "scripts/verify-ux-s06r-b-center-location-approval.mjs"
      - "scripts/verify-platform-role-reachability-ui.mjs"
      - ".github/workflows/ux-s06r-c-admin-resolution-hierarchy-quality.yml"

permissions:
  contents: read

jobs:
  admin-resolution-hierarchy-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify UX-S06R-C Admin Resolution hierarchy
        run: node scripts/verify-ux-s06r-c-admin-resolution-hierarchy.mjs

      - name: Verify Cube R Admin Resolution UI/security contract
        run: node scripts/verify-cube-r-claim-admin-resolution-ui.mjs

      - name: Verify UX-S06R-A Center hierarchy regression
        run: node scripts/verify-ux-s06r-a-center-admin-density.mjs

      - name: Verify UX-S06R-B Center location/approval regression
        run: node scripts/verify-ux-s06r-b-center-location-approval.mjs

      - name: Verify S03R role reachability contracts
        run: node scripts/verify-platform-role-reachability-ui.mjs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify build does not rewrite tracked configuration
        run: git diff --exit-code -- . ':!next-env.d.ts'
