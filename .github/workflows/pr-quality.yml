name: PR Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify contextual Roll QR contract
        run: node --experimental-strip-types scripts/verify-roll-qr-contract.mjs
      - name: Verify outer Roll label planning contract
        run: node --experimental-strip-types scripts/verify-outer-roll-label-plan.cjs
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify build does not rewrite tracked configuration
        run: git diff --exit-code -- package-lock.json tsconfig.json next-env.d.ts
