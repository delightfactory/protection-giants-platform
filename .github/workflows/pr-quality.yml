name: PR Quality

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install independent QR verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zbar-tools poppler-utils
      - name: Verify QR generation and independent decoding
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/qr-reliability-test
          npx tsc scripts/verify-qr-reliability.ts \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --esModuleInterop \
            --skipLibCheck \
            --strict \
            --outDir /tmp/qr-reliability-test
          NODE_PATH="$PWD/node_modules" node /tmp/qr-reliability-test/scripts/verify-qr-reliability.js
      - name: Verify contextual Roll QR contract
        run: node --experimental-strip-types scripts/verify-roll-qr-contract.mjs
      - name: Verify Pre-install Issue client integration contracts
        run: node scripts/verify-roll-preinstall-issue-client-contract.mjs
      - name: Verify platform role reachability UI contracts
        run: node scripts/verify-platform-role-reachability-ui.mjs
      - name: Verify operational timestamp presentation contracts
        run: node scripts/verify-platform-datetime-presentation.mjs
      - name: Verify Notification Inbox UI contract
        run: node scripts/verify-notification-inbox-ui-contract.mjs
      - name: Verify Notification Push API static security contract
        run: node scripts/verify-notification-push-api-contract.mjs
      - name: Verify Notification Push API interactions
        run: npx vitest run scripts/verify-notification-push-api-security.test.mjs --config vitest.config.mjs
      - name: Verify Notification Push worker static transport contract
        run: node scripts/verify-notification-push-worker-transport-contract.mjs
      - name: Verify Notification Push worker transport behavior
        run: npx vitest run scripts/verify-notification-push-worker-transport.test.mjs --config vitest.config.mjs
      - name: Verify Transfer Send client contracts
        run: node --experimental-strip-types scripts/verify-transfer-send-client-contract.mjs
      - name: Verify Transfer Receipt client retry contracts
        run: node --experimental-strip-types scripts/verify-transfer-receipt-client-contract.mjs
      - name: Verify Transfer Receipt component interactions
        run: npx vitest run scripts/verify-transfer-receipt-interactions.test.mjs --config vitest.config.mjs
      - name: Verify outer Roll label planning contract
        run: node --experimental-strip-types scripts/verify-outer-roll-label-plan.cjs
      - name: Verify outer Roll label request contract
        run: node --experimental-strip-types scripts/verify-outer-roll-label-request.cjs
      - name: Verify outer Roll print-profile and imposition contract
        run: node --experimental-strip-types scripts/verify-outer-roll-print-layout.cjs
      - name: Verify outer Roll vector renderer contract
        id: renderer_contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            rm -rf /tmp/cube-e-renderer-test
            npx tsc scripts/verify-outer-roll-label-renderer.ts \
              --target ES2022 \
              --module NodeNext \
              --moduleResolution NodeNext \
              --esModuleInterop \
              --skipLibCheck \
              --strict \
              --outDir /tmp/cube-e-renderer-test
            NODE_PATH="$PWD/node_modules" node /tmp/cube-e-renderer-test/scripts/verify-outer-roll-label-renderer.js
          } 2>&1 | tee /tmp/cube-e-renderer-contract.log
      - name: Upload outer Roll renderer diagnostics
        if: steps.renderer_contract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: outer-roll-renderer-diagnostics
          path: /tmp/cube-e-renderer-contract.log
          if-no-files-found: error
          retention-days: 3
      - name: Stop after outer Roll renderer failure
        if: steps.renderer_contract.outcome == 'failure'
        run: |
          echo "Outer Roll renderer contract failed. Diagnostic log was uploaded as outer-roll-renderer-diagnostics."
          exit 1
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify build does not rewrite tracked configuration
        run: git diff --exit-code -- package-lock.json tsconfig.json next-env.d.ts
