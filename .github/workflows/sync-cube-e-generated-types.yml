name: Sync Cube E Generated Types

"on":
  push:
    branches:
      - feature/cube-e-outer-roll-label-print-foundation
    paths:
      - ".github/workflows/sync-cube-e-generated-types.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-e-outer-roll-label-print-foundation
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild schema and generate canonical public types
        run: |
          supabase db reset --local --no-seed
          supabase gen types typescript --local --schema public > lib/supabase/database.types.ts

      - name: Commit generated types if changed
        run: |
          git diff --check
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Generated types are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "Sync generated Supabase types for Product GTIN"
          git push origin HEAD:feature/cube-e-outer-roll-label-print-foundation

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
