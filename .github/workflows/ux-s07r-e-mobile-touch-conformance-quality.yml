name: UX S07R E Mobile Touch Conformance Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "app/interaction.css"
      - "app/globals.css"
      - "app/operations/interaction.css"
      - "app/layout.tsx"
      - "app/not-found.tsx"
      - "app/operations/error.tsx"
      - "app/operations/not-found.tsx"
      - "components/ui/status-badge.tsx"
      - "components/ui/empty-state.tsx"
      - "components/ui/local-evidence-review.tsx"
      - "docs/mobile-native-interface-standard.md"
      - "docs/design-system.md"
      - "scripts/verify-ux-s07r-e-mobile-touch-conformance.mjs"
      - "scripts/verify-ux-s07r-d-action-workspace-vocabulary.mjs"
      - ".github/workflows/ux-s07r-e-mobile-touch-conformance-quality.yml"

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  mobile-touch-conformance-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify UX-S07R-E mobile touch and visual conformance
        run: node scripts/verify-ux-s07r-e-mobile-touch-conformance.mjs

      - name: Verify UX-S07R-D action workspace vocabulary regression
        run: node scripts/verify-ux-s07r-d-action-workspace-vocabulary.mjs

      - name: Verify UX-S07R-C Resolution detail regression
        run: node scripts/verify-ux-s07r-c-resolution-detail-vocabulary.mjs

      - name: Verify UX-S07R-B Claim detail vocabulary regression
        run: node scripts/verify-ux-s07r-b-claim-detail-vocabulary.mjs

      - name: Verify UX-S07R-A shared vocabulary regression
        run: node scripts/verify-ux-s07r-a-shared-vocabulary.mjs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify build does not rewrite tracked configuration
        run: git diff --exit-code -- . ':!next-env.d.ts'
