name: Cube M Temporary Public Type Sync

on:
  push:
    branches:
      - feature/cube-m-warranty-activation
    paths:
      - ".github/workflows/cube-m-sync-public-types-temp.yml"

permissions:
  contents: write

jobs:
  sync-public-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-m-warranty-activation
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Generate canonical public database types
        run: supabase gen types typescript --local --schema public > lib/supabase/database.types.ts

      - name: Commit exact generated public types
        shell: bash
        run: |
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Generated public database types are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "chore(cube-m): sync canonical public database types"
          git push origin HEAD:feature/cube-m-warranty-activation

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
