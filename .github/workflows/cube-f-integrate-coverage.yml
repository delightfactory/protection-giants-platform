name: Cube F Integrate Coverage

on:
  push:
    branches:
      - agent/cube-f-transfer-state-reservation
    paths:
      - ".github/workflows/cube-f-integrate-coverage.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/cube-f-transfer-state-reservation

      - name: Wire permanent Cube F coverage into Database Quality
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/database-quality.yml')
          text = path.read_text()
          path_anchor = '      - "scripts/verify-roll-transfer-races-scale.mjs"\n'
          path_insert = path_anchor + '      - "scripts/verify-roll-transfer-lifecycle-coverage.mjs"\n'
          if 'verify-roll-transfer-lifecycle-coverage.mjs"' not in text:
              if path_anchor not in text:
                  raise SystemExit('Cube F path anchor not found')
              text = text.replace(path_anchor, path_insert, 1)
          run_anchor = '          if [ "$test_status" -eq 0 ]; then\n            node scripts/verify-roll-transfer-races-scale.mjs\n            test_status=$?\n          fi\n          set -e\n'
          run_insert = '          if [ "$test_status" -eq 0 ]; then\n            node scripts/verify-roll-transfer-races-scale.mjs\n            test_status=$?\n          fi\n\n          if [ "$test_status" -eq 0 ]; then\n            node scripts/verify-roll-transfer-lifecycle-coverage.mjs\n            test_status=$?\n          fi\n          set -e\n'
          if 'node scripts/verify-roll-transfer-lifecycle-coverage.mjs' not in text:
              if run_anchor not in text:
                  raise SystemExit('Cube F execution anchor not found')
              text = text.replace(run_anchor, run_insert, 1)
          path.write_text(text)
          PY

      - name: Commit workflow integration
        run: |
          if git diff --quiet -- .github/workflows/database-quality.yml; then
            echo "Database Quality already contains the coverage test."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/database-quality.yml
          git commit -m "Run complete Cube F lifecycle coverage"
          git push origin HEAD:agent/cube-f-transfer-state-reservation