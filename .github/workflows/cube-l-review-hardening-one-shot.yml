name: Cube L Review Hardening One Shot

on:
  push:
    branches:
      - feature/cube-l-notifications-pwa
    paths:
      - .github/workflows/cube-l-review-hardening-one-shot.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cube-l-notifications-pwa
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply bounded review fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Center onboarding reconciliation must repair the mandatory L-ON-01
          # durable notification after a committed/retried provisioning flow.
          path = Path("app/onboarding/center/actions.ts")
          text = path.read_text()
          old = '''      const { error: reconcileError } = await supabaseAdmin
        .from("center_onboarding_invitations")
        .update({ status: "accepted", accepted_at: new Date().toISOString() })
        .eq("auth_user_id", userId)
        .eq("installation_center_id", existingProfile.installation_center_id)
        .eq("status", "pending");
      if (reconcileError) throw reconcileError;
      redirect("/operations");'''
          new = '''      const { data: reconciliationInvitation, error: reconciliationReadError } = await supabaseAdmin
        .from("center_onboarding_invitations")
        .select("id, status, review_required_at, failure_code")
        .eq("auth_user_id", userId)
        .eq("installation_center_id", existingProfile.installation_center_id)
        .in("status", ["pending", "accepted"])
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();
      if (reconciliationReadError) throw reconciliationReadError;

      if (
        reconciliationInvitation &&
        reconciliationInvitation.review_required_at === null &&
        reconciliationInvitation.failure_code === null
      ) {
        if (reconciliationInvitation.status === "pending") {
          const { error: reconcileError } = await supabaseAdmin
            .from("center_onboarding_invitations")
            .update({ status: "accepted", accepted_at: new Date().toISOString() })
            .eq("id", reconciliationInvitation.id)
            .eq("auth_user_id", userId)
            .eq("installation_center_id", existingProfile.installation_center_id)
            .eq("status", "pending")
            .is("review_required_at", null)
            .is("failure_code", null);
          if (reconcileError) throw reconcileError;
        }

        const { error: reconciliationNotificationError } = await supabaseAdmin.rpc(
          "materialize_center_onboarding_success",
          { p_invitation_id: reconciliationInvitation.id },
        );
        if (reconciliationNotificationError) throw reconciliationNotificationError;
      }

      redirect("/operations");'''
          assert old in text, "onboarding reconciliation target changed"
          path.write_text(text.replace(old, new, 1))

          # Strengthen the permanent source contract to cover both normal and
          # reconciliation/retry materialization paths.
          path = Path("scripts/verify-notification-onboarding-app-integration.mjs")
          text = path.read_text()
          old = '''const materializerName = '\"materialize_center_onboarding_success\"';
const materializerIndex = actions.indexOf(materializerName);
const finalRevalidateIndex = actions.indexOf('revalidatePath(\"/operations\");', materializerIndex);'''
          new = '''const materializerName = '\"materialize_center_onboarding_success\"';
const materializerIndices = [...actions.matchAll(new RegExp(materializerName, "g"))].map((match) => match.index ?? -1);
const reconciliationIndex = actions.indexOf("const { data: reconciliationInvitation");
const materializerIndex = materializerIndices[1] ?? -1;
const finalRevalidateIndex = actions.indexOf('revalidatePath(\"/operations\");', materializerIndex);'''
          assert old in text, "onboarding test index target changed"
          text = text.replace(old, new, 1)
          old = '''assert(
  materializerIndex === actions.lastIndexOf(materializerName),
  "Normal onboarding success materializer must be called exactly once; provisional invitation acceptance must not emit success.",
);'''
          new = '''assert(
  materializerIndices.length === 2 &&
    reconciliationIndex >= 0 &&
    materializerIndices[0] > reconciliationIndex &&
    materializerIndices[0] < exactProfileIndex,
  "Existing-Profile reconciliation/retry must idempotently repair the mandatory onboarding success notification.",
);
assert(
  actions.includes('.in("status", ["pending", "accepted"])') &&
    actions.includes("reconciliationInvitation.review_required_at === null") &&
    actions.includes("reconciliationInvitation.failure_code === null") &&
    actions.includes("{ p_invitation_id: reconciliationInvitation.id }") &&
    actions.includes("if (reconciliationNotificationError) throw reconciliationNotificationError;"),
  "Onboarding reconciliation must cover pending/accepted normal invitations without emitting the review-required path.",
);'''
          assert old in text, "onboarding test exact-once target changed"
          path.write_text(text.replace(old, new, 1))

          # 2) A received Push must refresh already-open clients so durable Inbox
          # unread state does not remain stale until a manual reload/navigation.
          path = Path("public/sw.js")
          text = path.read_text()
          marker = '''async function markAppBadge() {
  if (typeof self.navigator?.setAppBadge !== "function") return;
  try {
    await self.navigator.setAppBadge();
  } catch {
    // App badging is progressive enhancement and must never block notification display.
  }
}
'''
          addition = marker + '''
async function refreshOpenClients() {
  const clients = await self.clients.matchAll({ type: "window", includeUncontrolled: true });
  for (const client of clients) {
    try {
      client.postMessage({ type: "PG_NOTIFICATION_PUSH_RECEIVED" });
    } catch {
      // Client refresh is best-effort and must never block persistent notification display.
    }
  }
}
'''
          assert marker in text and "PG_NOTIFICATION_PUSH_RECEIVED" not in text, "service worker refresh target changed"
          text = text.replace(marker, addition, 1)
          needle = '''    await self.registration.showNotification(title, {
      body,
      tag,
      renotify: false,
      icon: "/icons/pwa-192.png",
      badge: "/icons/pwa-192.png",
      dir: "rtl",
      lang: "ar",
      data: { actionPath, notificationId },
    });'''
          replacement = needle + '''
    await refreshOpenClients();'''
          assert needle in text, "service worker notification target changed"
          path.write_text(text.replace(needle, replacement, 1))

          path = Path("components/app-badge-sync.tsx")
          text = path.read_text()
          assert 'import { useEffect } from "react";' in text and 'useRouter' not in text, "badge sync import target changed"
          text = text.replace(
            'import { useEffect } from "react";',
            'import { useEffect } from "react";\nimport { useRouter } from "next/navigation";',
            1,
          )
          old = '''export function AppBadgeSync({ unreadCount }: Readonly<{ unreadCount: number }>) {
  useEffect(() => {'''
          new = '''export function AppBadgeSync({ unreadCount }: Readonly<{ unreadCount: number }>) {
  const router = useRouter();

  useEffect(() => {
    if (!("serviceWorker" in navigator)) return;
    const onMessage = (event: MessageEvent) => {
      if (event.data?.type === "PG_NOTIFICATION_PUSH_RECEIVED") router.refresh();
    };
    navigator.serviceWorker.addEventListener("message", onMessage);
    return () => navigator.serviceWorker.removeEventListener("message", onMessage);
  }, [router]);

  useEffect(() => {'''
          assert old in text, "badge sync component target changed"
          path.write_text(text.replace(old, new, 1))

          path = Path("scripts/verify-notification-pwa-lifecycle-contract.mjs")
          text = path.read_text()
          assert 'const coordinator = read("components/pwa-lifecycle.tsx");' in text
          text = text.replace(
            'const coordinator = read("components/pwa-lifecycle.tsx");',
            'const coordinator = read("components/pwa-lifecycle.tsx");\nconst badgeSync = read("components/app-badge-sync.tsx");',
            1,
          )
          anchor = '''assert(sw.includes("self.registration.showNotification"), "Every received Push must surface a persistent notification.");'''
          addition = anchor + '''
assert(sw.includes("PG_NOTIFICATION_PUSH_RECEIVED") && sw.includes("client.postMessage"),
  "Received Push must notify open app clients so unread Inbox state can refresh.");'''
          assert anchor in text
          text = text.replace(anchor, addition, 1)
          anchor = '''assert(operationsLayout.includes("PwaLifecycleCoordinator"), "PWA lifecycle coordinator must be mounted once in operations layout.");'''
          addition = anchor + '''
assert(operationsLayout.includes("AppBadgeSync"), "Operations shell must mount unread/badge synchronization.");
assert(badgeSync.includes('navigator.serviceWorker.addEventListener("message"') &&
  badgeSync.includes('event.data?.type === "PG_NOTIFICATION_PUSH_RECEIVED"') &&
  badgeSync.includes("router.refresh()"),
  "Open app clients must consume Push refresh messages and refresh server-derived unread state.");'''
          assert anchor in text
          path.write_text(text.replace(anchor, addition, 1))

      - name: Verify focused contracts
        run: |
          node scripts/verify-notification-onboarding-app-integration.mjs
          node scripts/verify-notification-pwa-lifecycle-contract.mjs

      - name: Commit bounded hardening and remove one-shot workflow
        run: |
          rm .github/workflows/cube-l-review-hardening-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/onboarding/center/actions.ts \
            scripts/verify-notification-onboarding-app-integration.mjs \
            public/sw.js \
            components/app-badge-sync.tsx \
            scripts/verify-notification-pwa-lifecycle-contract.mjs \
            .github/workflows/cube-l-review-hardening-one-shot.yml
          git diff --cached --check
          git commit -m "fix(cube-l): close review qualification gaps"
          git push origin HEAD:feature/cube-l-notifications-pwa
