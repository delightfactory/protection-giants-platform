# Retry after verified server-only profile mutation contract fix.
name: Sync Center Location Types

on:
  push:
    branches:
      - feature/center-location-foundation
    paths:
      - .github/workflows/tmp-sync-center-location-types.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/center-location-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from committed migrations
        run: supabase db reset --local --no-seed

      - name: Lint database
        run: supabase db lint --local --level warning --fail-on error

      - name: Verify Center Location contracts
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-center-location-foundation.mjs

      - name: Generate canonical public schema types
        run: |
          supabase gen types typescript --local --schema public > lib/supabase/database.types.ts
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'lib/supabase/database.types.ts';
          const content = fs.readFileSync(path, 'utf8').replace(/\n*$/, '\n');
          fs.writeFileSync(path, content, 'utf8');
          NODE

      - name: Commit generated types and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-sync-center-location-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts .github/workflows/tmp-sync-center-location-types.yml
          git diff --cached --check
          git commit -m "chore: sync generated database types"
          git push origin HEAD:feature/center-location-foundation

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
