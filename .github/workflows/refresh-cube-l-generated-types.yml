name: Refresh Cube L Generated Types

on:
  push:
    branches:
      - feature/cube-l-notifications-pwa
    paths:
      - ".github/workflows/refresh-cube-l-generated-types.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-l-notifications-pwa
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Rebuild local database
        run: |
          supabase start
          supabase db reset --local --no-seed

      - name: Generate exact database types
        run: supabase gen types typescript --local --schema public > lib/supabase/database.types.ts

      - name: Commit generated types if changed
        shell: bash
        run: |
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Generated types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "chore(db): refresh generated types for Cube L"
          git push origin HEAD:feature/cube-l-notifications-pwa

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
