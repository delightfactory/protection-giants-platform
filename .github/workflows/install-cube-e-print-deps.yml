name: Install Cube E Print Dependencies

"on":
  push:
    branches:
      - feature/cube-e-outer-roll-label-print-foundation
    paths:
      - ".github/workflows/install-cube-e-print-deps.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-e-outer-roll-label-print-foundation
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact print dependencies
        run: npm install --save-exact pdf-lib@1.17.1 bwip-js@4.11.2 --no-audit --no-fund
      - name: Commit dependency lock
        run: |
          git diff --check
          if git diff --quiet -- package.json package-lock.json; then
            echo "Print dependencies are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add bounded Cube E print dependencies"
          git push origin HEAD:feature/cube-e-outer-roll-label-print-foundation
