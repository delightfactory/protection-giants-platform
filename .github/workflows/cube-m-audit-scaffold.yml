name: Cube M Audit Scaffold

"on":
  push:
    branches:
      - fix/cube-m-independent-audit-closure
    paths:
      - ".github/workflows/cube-m-audit-scaffold.yml"

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/cube-m-independent-audit-closure

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Create migration with Supabase CLI
        run: supabase migration new cube_m_independent_audit_read

      - name: Commit scaffold only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*_cube_m_independent_audit_read.sql
          git commit -m "chore(cube-m): scaffold independent audit migration"
          git push