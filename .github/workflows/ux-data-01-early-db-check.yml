name: UX-DATA-01 Early DB Check

on:
  push:
    branches:
      - agent/ux-data-01-operational-evidence-lifecycle
    paths:
      - "supabase/migrations/20260831103000_ux_data_01_operational_evidence_lifecycle.sql"
      - ".github/workflows/ux-data-01-early-db-check.yml"

permissions:
  contents: write

jobs:
  db-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ux-data-01-operational-evidence-lifecycle
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Show CLI contract
        run: |
          supabase --version
          supabase migration --help >/tmp/supabase-migration-help.txt
          supabase db --help >/tmp/supabase-db-help.txt

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint database
        run: supabase db lint --local --level warning --fail-on error

      - name: Generate public database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          const path = "/tmp/generated.database.types.ts";
          const content = fs.readFileSync(path, "utf8").replace(/\n*$/, "\n");
          fs.writeFileSync(path, content);
          NODE
          cp /tmp/generated.database.types.ts lib/supabase/database.types.ts

      - name: Commit generated database types when changed
        shell: bash
        run: |
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Generated database types already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "chore(ux-data-01): refresh generated database types"
          git fetch origin agent/ux-data-01-operational-evidence-lifecycle
          git rebase origin/agent/ux-data-01-operational-evidence-lifecycle
          git push origin HEAD:agent/ux-data-01-operational-evidence-lifecycle

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
