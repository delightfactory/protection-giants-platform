name: Temporary Cube H Closure Patch

"on":
  push:
    branches:
      - feature/cube-h-transfer-receipt-resolution
    paths:
      - ".github/workflows/sync-cube-h-db-types.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-h-transfer-receipt-resolution

      - name: Apply deterministic closure patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          db_path = Path('.github/workflows/database-quality.yml')
          lines = db_path.read_text().splitlines()

          trigger_line = '      - "scripts/verify-transfer-receipt-recovery-reads.mjs"'
          grant_trigger = '      - "scripts/verify-transfer-item-state-grants.mjs"'
          if grant_trigger not in lines:
              idx = lines.index(trigger_line)
              lines.insert(idx + 1, grant_trigger)

          grant_exec = '            node scripts/verify-transfer-item-state-grants.mjs'
          if grant_exec not in lines:
              recovery_exec = '            node scripts/verify-transfer-receipt-recovery-reads.mjs'
              node_idx = lines.index(recovery_exec)
              fi_idx = next(i for i in range(node_idx + 1, len(lines)) if lines[i] == '          fi')
              block = [
                  '',
                  '          if [ "$test_status" -eq 0 ]; then',
                  grant_exec,
                  '            test_status=$?',
                  '          fi',
              ]
              lines[fi_idx + 1:fi_idx + 1] = block

          db_path.write_text('\n'.join(lines) + '\n')

          receipt_path = Path('components/transfers/transfer-receipt-flow.tsx')
          receipt_lines = receipt_path.read_text().splitlines()
          heading_found = copy_found = False
          old_heading = '<h2>{finalReceipt ? "تم استلام التحويل بالكامل" : "تم تأكيد الاستلام الجزئي"}</h2>'
          for index, line in enumerate(receipt_lines):
              if old_heading in line:
                  receipt_lines[index] = line.replace(old_heading, '<h2>تم تأكيد استلام اللفات</h2>')
                  heading_found = True
              if 'انتقلت العهدة المؤكدة لـ{selectedCount} لفة إلى جهتك.' in line and 'afterReceiptRemaining' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  receipt_lines[index] = indent + 'انتقلت العهدة المؤكدة لـ{selectedCount} لفة إلى جهتك. افتح تفاصيل التحويل للاطلاع على الحالة الحالية واللفات المتبقية بعد تحديثها.'
                  copy_found = True

          if not heading_found:
              raise SystemExit('Receipt success heading anchor was not found.')
          if not copy_found:
              raise SystemExit('Receipt success copy anchor was not found.')

          receipt_path.write_text('\n'.join(receipt_lines) + '\n')
          PY

      - name: Commit closure patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/database-quality.yml components/transfers/transfer-receipt-flow.tsx
          git diff --cached --check
          git commit -m "fix(transfers): close Cube H review gates"
          git push origin HEAD:feature/cube-h-transfer-receipt-resolution
