name: Temporary Cube H Closure Patch

"on":
  push:
    branches:
      - feature/cube-h-transfer-receipt-resolution
    paths:
      - ".github/workflows/sync-cube-h-db-types.yml"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-h-transfer-receipt-resolution

      - name: Integrate final closure checks and copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          recovery_path = Path('scripts/verify-transfer-receipt-recovery-reads.mjs')
          recovery = recovery_path.read_text()
          crypto_import = 'import { randomUUID } from "node:crypto";'
          child_import = 'import { execFileSync } from "node:child_process";'
          if child_import not in recovery:
              if crypto_import not in recovery:
                  raise SystemExit('Recovery contract import anchor was not found.')
              recovery = recovery.replace(crypto_import, crypto_import + '\n' + child_import, 1)

          marker = 'console.log("Cube H receipt recovery/attention read contracts verified.");'
          if 'Cube H item-state safe-column grants verified.' not in recovery:
              if marker not in recovery:
                  raise SystemExit('Recovery contract completion anchor was not found.')
              grant_lines = [
                  'const grantContainerNames = execFileSync("docker", ["ps", "--format", "{{.Names}}"], { encoding: "utf8" })',
                  '  .split("\\n").map((value) => value.trim()).filter(Boolean);',
                  'const grantDbContainer = grantContainerNames.find((value) => value.startsWith("supabase_db_"));',
                  'assert(grantDbContainer, "Supabase database container was not found for item-state grant verification.");',
                  '',
                  'function queryGrant(sql) {',
                  '  return execFileSync(',
                  '    "docker",',
                  '    ["exec", "-i", grantDbContainer, "psql", "-At", "-v", "ON_ERROR_STOP=1", "-U", "postgres", "-d", "postgres", "-c", sql],',
                  '    { encoding: "utf8" },',
                  '  ).trim();',
                  '}',
                  '',
                  'for (const column of ["transfer_id", "roll_id", "status", "acted_at"]) {',
                  '  assert(',
                  '    queryGrant(`select has_column_privilege(\'authenticated\', \'public.roll_transfer_item_states\', \'${column}\', \'SELECT\');`) === "t",',
                  '    `authenticated lost approved safe item-state column ${column}.`,',
                  '  );',
                  '}',
                  '',
                  'for (const column of ["action_request_id", "acted_by_profile_id", "acted_by_party_id", "resolution_reason", "created_at"]) {',
                  '  assert(',
                  '    queryGrant(`select has_column_privilege(\'authenticated\', \'public.roll_transfer_item_states\', \'${column}\', \'SELECT\');`) === "f",',
                  '    `authenticated can read private item-state column ${column}.`,',
                  '  );',
                  '  assert(',
                  '    queryGrant(`select has_column_privilege(\'service_role\', \'public.roll_transfer_item_states\', \'${column}\', \'SELECT\');`) === "f",',
                  '    `service_role Data API can read private item-state column ${column}.`,',
                  '  );',
                  '}',
                  '',
                  'assert(',
                  '  queryGrant("select has_table_privilege(\'authenticated\', \'public.roll_transfer_item_states\', \'INSERT,UPDATE,DELETE\');") === "f",',
                  '  "authenticated unexpectedly gained direct item-state mutation privileges.",',
                  ');',
                  '',
                  'console.log("Cube H item-state safe-column grants verified.");',
                  '',
              ]
              recovery = recovery.replace(marker, '\n'.join(grant_lines) + marker, 1)

          recovery_path.write_text(recovery)

          grant_path = Path('scripts/verify-transfer-item-state-grants.mjs')
          if grant_path.exists():
              grant_path.unlink()

          receipt_path = Path('components/transfers/transfer-receipt-flow.tsx')
          receipt_lines = receipt_path.read_text().splitlines()
          old_heading = '<h2>{finalReceipt ? "تم استلام التحويل بالكامل" : "تم تأكيد الاستلام الجزئي"}</h2>'
          heading_found = copy_found = False
          for index, line in enumerate(receipt_lines):
              if old_heading in line:
                  receipt_lines[index] = line.replace(old_heading, '<h2>تم تأكيد استلام اللفات</h2>')
                  heading_found = True
              if 'انتقلت العهدة المؤكدة لـ{selectedCount} لفة إلى جهتك.' in line and 'afterReceiptRemaining' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  receipt_lines[index] = indent + 'انتقلت العهدة المؤكدة لـ{selectedCount} لفة إلى جهتك. افتح تفاصيل التحويل للاطلاع على الحالة الحالية واللفات المتبقية بعد تحديثها.'
                  copy_found = True

          if not heading_found:
              raise SystemExit('Receipt success heading anchor was not found.')
          if not copy_found:
              raise SystemExit('Receipt success copy anchor was not found.')
          receipt_path.write_text('\n'.join(receipt_lines) + '\n')
          PY

      - name: Commit closure patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-transfer-receipt-recovery-reads.mjs scripts/verify-transfer-item-state-grants.mjs components/transfers/transfer-receipt-flow.tsx
          git diff --cached --check
          git commit -m "fix(transfers): close Cube H review gates"
          git push origin HEAD:feature/cube-h-transfer-receipt-resolution
