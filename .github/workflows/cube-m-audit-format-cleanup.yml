name: Cube M Audit Format Cleanup

"on":
  push:
    branches:
      - fix/cube-m-independent-audit-closure
    paths:
      - ".github/workflows/cube-m-audit-format-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/cube-m-independent-audit-closure

      - name: Normalize confirmation block formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/warranties/admin-warranty-support.tsx')
          text = path.read_text()
          start = text.index('              <ConfirmSubmitButton\n', text.index('سبب التصحيح'))
          end_marker = '              </ConfirmSubmitButton>'
          end = text.index(end_marker, start) + len(end_marker)
          clean = '''              <ConfirmSubmitButton
                title="تأكيد حفظ التصحيح؟"
                description="سيتم حفظ بيانات العميل/السيارة المصححة مع السبب وتسجيل Before/After دائم في سجل التدقيق."
                confirmLabel="نعم، حفظ التصحيح"
                tone="primary"
                disabled={isCorrecting || isVoiding}
              >
                {isCorrecting ? "جارٍ حفظ التصحيح…" : "حفظ التصحيح"}
              </ConfirmSubmitButton>'''
          path.write_text(text[:start] + clean + text[end:])
          PY
          rm .github/workflows/cube-m-audit-format-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/warranties/admin-warranty-support.tsx .github/workflows/cube-m-audit-format-cleanup.yml
          git commit -m "style(cube-m): normalize audit closure formatting"
          git push
