name: UX-DATA-01 Operational Evidence Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/*ux_data_01*"
      - "app/operations/claim-inspections/actions.ts"
      - "app/operations/claim-resolutions/actions.ts"
      - "app/operations/claim-resolutions/recovery-actions.ts"
      - "lib/supabase/database.types.ts"
      - "scripts/verify-ux-data-01-*.mjs"
      - "scripts/cleanup-operational-evidence.mjs"
      - "scripts/ux-data-01-stage-test-adapter.mjs"
      - "docs/ux-data-01-operational-evidence-lifecycle-spec.md"
      - ".github/workflows/ux-data-01-operational-evidence-quality.yml"

permissions:
  contents: read

concurrency:
  group: ux-data-01-operational-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operational-evidence-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Verify application evidence lifecycle ordering
        run: node scripts/verify-ux-data-01-operational-evidence-app-contract.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint database
        run: supabase db lint --local --level warning --fail-on error

      - name: Create bounded Product / Center / Warranty fixtures
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-roll-opening-foundation.mjs
          node scripts/verify-warranty-schema-foundation.mjs
          node scripts/verify-warranty-activation-engine.mjs

      - name: Create submitted Customer Claim fixture through Cube P
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-p-claim-intake.mjs

      - name: Verify operational evidence lifecycle runtime contract
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-ux-data-01-operational-evidence-lifecycle.mjs

      - name: Verify generated public database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          for (const path of ["/tmp/generated.database.types.ts", "lib/supabase/database.types.ts"]) {
            fs.writeFileSync(path, fs.readFileSync(path, "utf8").replace(/\n*$/, "\n"));
          }
          NODE
          diff -u lib/supabase/database.types.ts /tmp/generated.database.types.ts

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Verify build does not rewrite tracked configuration
        run: git diff --exit-code -- . ':!next-env.d.ts'

      - name: Stop local stack
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
