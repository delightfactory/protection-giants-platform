name: Cube N Public Warranty Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "scripts/verify-cube-n-roll-public-identity.mjs"
      - "scripts/verify-cube-n-public-warranty-resolver.mjs"
      - "scripts/verify-cube-n-public-warranty-ui.mjs"
      - "scripts/verify-cube-n-public-warranty-lifecycle.mjs"
      - ".github/workflows/cube-n-public-warranty-quality.yml"
      - "app/(public)/w/**"
      - "app/(public)/warranty/**"
      - "lib/warranty/**"
      - "lib/supabase/database.types.ts"
      - "docs/cube-n-public-warranty-access-verification-spec.md"
      - "docs/cube-n-final-spec-review-amendment.md"
      - "docs/pre-cube-n-public-warranty-status-amendment.md"
      - "docs/product-decisions.md"

permissions:
  contents: read

jobs:
  public-warranty-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local --level warning --fail-on error

      - name: Create bounded existing-domain fixtures
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-roll-opening-foundation.mjs

      - name: Verify Cube N N1 Roll public identity foundation
        run: node scripts/verify-cube-n-roll-public-identity.mjs

      - name: Verify Cube N N2 public Warranty resolver boundary
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-cube-n-public-warranty-resolver.mjs

      - name: Verify Cube N N3 public Warranty UI contract
        run: node scripts/verify-cube-n-public-warranty-ui.mjs

      - name: Verify Cube N N4 permanent Public Code lifecycle integration
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-warranty-activation-engine.mjs
          node scripts/verify-cube-n-public-warranty-lifecycle.mjs

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
