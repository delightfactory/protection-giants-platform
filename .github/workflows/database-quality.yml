name: Database Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "lib/supabase/database.types.ts"
      - "scripts/verify-auth-config.mjs"
      - "scripts/verify-profile-auto-provisioning.mjs"
      - "scripts/verify-profile-admin-read.mjs"
      - "scripts/verify-data-api-grants.mjs"
      - "scripts/verify-user-admin-lifecycle.mjs"
      - "scripts/verify-operational-entities-lifecycle.mjs"
      - "scripts/verify-operational-entity-access-status.mjs"
      - "scripts/verify-agent-network-foundation.mjs"
      - "scripts/verify-center-onboarding.mjs"
      - "scripts/verify-center-onboarding-state-races.mjs"
      - "scripts/verify-center-onboarding-review-state.mjs"
      - "scripts/verify-center-location-foundation.mjs"
      - "scripts/verify-center-network-approval.mjs"
      - "scripts/verify-public-center-directory.mjs"
      - "scripts/verify-product-foundation.mjs"
      - "scripts/verify-product-foundation-constraints.mjs"
      - "scripts/verify-product-operational-access.mjs"
      - "scripts/verify-product-storage.mjs"
      - "scripts/verify-production-foundation.mjs"
      - "scripts/verify-production-boundaries.mjs"
      - "scripts/verify-roll-custody-backfill.mjs"
      - "scripts/verify-roll-custody-foundation.mjs"
      - "scripts/verify-cube-e-identity.mjs"
      - "scripts/verify-roll-transfer-state-reservation.mjs"
      - "scripts/verify-roll-transfer-races-scale.mjs"
      - ".github/workflows/database-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Verify committed local configuration
        run: test -f supabase/config.toml

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Verify Roll custody historical backfill migration
        run: |
          supabase db reset --local --no-seed --version 20260813185614
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          node scripts/verify-roll-custody-backfill.mjs seed
          supabase migration up --local
          node scripts/verify-roll-custody-backfill.mjs verify

      - name: Rebuild database from migrations
        id: db_reset
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          supabase db reset --local --no-seed 2>&1 | tee /tmp/db-reset.log

      - name: Upload database reset diagnostics
        if: steps.db_reset.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: database-reset-diagnostics
          path: /tmp/db-reset.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after database reset failure
        if: steps.db_reset.outcome == 'failure'
        run: |
          echo "Database rebuild failed. Diagnostic log was uploaded as database-reset-diagnostics."
          exit 1

      - name: Verify local stack
        run: supabase status

      - name: Lint local database
        run: supabase db lint --local --level warning --fail-on error

      - name: Verify new public functions require explicit grants
        run: |
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1 || true)"
          if [ -z "$db_container" ]; then
            echo "Supabase database container was not found."
            exit 1
          fi

          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          create function public.__ci_default_function_privilege_probe()
          returns boolean
          language sql
          as 'select true';

          do $$
          begin
            if has_function_privilege('anon', 'public.__ci_default_function_privilege_probe()', 'EXECUTE')
              or has_function_privilege('authenticated', 'public.__ci_default_function_privilege_probe()', 'EXECUTE')
              or has_function_privilege('service_role', 'public.__ci_default_function_privilege_probe()', 'EXECUTE')
            then
              raise exception 'new public functions still inherit Data API EXECUTE privileges';
            end if;
          end;
          $$;

          drop function public.__ci_default_function_privilege_probe();
          SQL

      - name: Verify database contracts through Cube F Roll Transfer state/reservation
        id: contract_tests
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/database-contracts.log) 2>&1
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY

          set +e
          node scripts/verify-auth-config.mjs
          test_status=$?

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-profile-auto-provisioning.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-data-api-grants.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-profile-admin-read.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-user-admin-lifecycle.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-operational-entities-lifecycle.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-operational-entity-access-status.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-agent-network-foundation.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-center-onboarding.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-center-onboarding-state-races.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-center-onboarding-review-state.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-center-location-foundation.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-center-network-approval.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-public-center-directory.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-product-foundation.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-product-foundation-constraints.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-product-operational-access.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-product-storage.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-production-foundation.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-production-boundaries.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-roll-custody-foundation.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-cube-e-identity.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-roll-transfer-state-reservation.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-roll-transfer-races-scale.mjs
            test_status=$?
          fi
          set -e

          if [ "$test_status" -ne 0 ]; then
            echo "::group::Supabase Auth logs"
            auth_container="$(docker ps --format '{{.Names}}' | grep '^supabase_auth_' | head -n 1 || true)"
            if [ -n "$auth_container" ]; then
              docker logs --tail 200 "$auth_container" 2>&1 || true
            else
              echo "Supabase Auth container was not found."
            fi
            echo "::endgroup::"

            echo "::group::Supabase Postgres logs"
            db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1 || true)"
            if [ -n "$db_container" ]; then
              docker logs --tail 200 "$db_container" 2>&1 || true
            else
              echo "Supabase database container was not found."
            fi
            echo "::endgroup::"

            echo "::group::Supabase Storage logs"
            storage_container="$(docker ps --format '{{.Names}}' | grep '^supabase_storage_' | head -n 1 || true)"
            if [ -n "$storage_container" ]; then
              docker logs --tail 200 "$storage_container" 2>&1 || true
            else
              echo "Supabase Storage container was not found."
            fi
            echo "::endgroup::"

            exit "$test_status"
          fi

      - name: Upload database contract diagnostics
        if: steps.contract_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: database-contract-diagnostics
          path: /tmp/database-contracts.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop after database contract failure
        if: steps.contract_tests.outcome == 'failure'
        run: |
          echo "Database contract verification failed. Diagnostic log was uploaded as database-contract-diagnostics."
          exit 1

      - name: Verify generated database types
        id: generated_types
        continue-on-error: true
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.database.types.ts
          cp lib/supabase/database.types.ts /tmp/committed.database.types.ts
          node <<'NODE'
          const fs = require("node:fs");
          for (const path of [
            "/tmp/generated.database.types.ts",
            "/tmp/committed.database.types.ts",
          ]) {
            const content = fs.readFileSync(path, "utf8").replace(/\n*$/, "\n");
            fs.writeFileSync(path, content);
          }
          NODE
          if ! diff -u /tmp/committed.database.types.ts /tmp/generated.database.types.ts; then
            echo "Committed database types are out of sync with the public application schema."
            exit 1
          fi

      - name: Upload generated database types
        if: steps.generated_types.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-database-types
          path: /tmp/generated.database.types.ts
          if-no-files-found: error
          retention-days: 3

      - name: Stop after database type mismatch
        if: steps.generated_types.outcome == 'failure'
        run: |
          echo "Generated database types differ from the committed file. The generated file was uploaded as generated-database-types."
          exit 1

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup