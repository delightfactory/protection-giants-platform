name: Database Quality

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - "lib/supabase/database.types.ts"
      - "scripts/verify-profile-auto-provisioning.mjs"
      - "scripts/verify-profile-admin-read.mjs"
      - "scripts/verify-data-api-grants.mjs"
      - "scripts/verify-user-admin-lifecycle.mjs"
      - ".github/workflows/database-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Verify committed local configuration
        run: test -f supabase/config.toml

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Verify local stack
        run: supabase status

      - name: Lint local database
        run: supabase db lint --local --level warning --fail-on error

      - name: Verify Auth, Data API grants, RLS and user lifecycle contracts
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY

          set +e
          node scripts/verify-profile-auto-provisioning.mjs
          test_status=$?

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-data-api-grants.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-profile-admin-read.mjs
            test_status=$?
          fi

          if [ "$test_status" -eq 0 ]; then
            node scripts/verify-user-admin-lifecycle.mjs
            test_status=$?
          fi
          set -e

          if [ "$test_status" -ne 0 ]; then
            echo "::group::Supabase Auth logs"
            auth_container="$(docker ps --format '{{.Names}}' | grep '^supabase_auth_' | head -n 1 || true)"
            if [ -n "$auth_container" ]; then
              docker logs --tail 200 "$auth_container" 2>&1 || true
            else
              echo "Supabase Auth container was not found."
            fi
            echo "::endgroup::"

            echo "::group::Supabase Postgres logs"
            db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1 || true)"
            if [ -n "$db_container" ]; then
              docker logs --tail 200 "$db_container" 2>&1 || true
            else
              echo "Supabase database container was not found."
            fi
            echo "::endgroup::"

            exit "$test_status"
          fi

      - name: Verify generated database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          if ! diff -u lib/supabase/database.types.ts /tmp/database.types.ts; then
            echo "Committed database types are out of sync with the public schema."
            exit 1
          fi

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
