name: Cube N Sync Generated Types

"on":
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cube-n-sync-generated-types.yml"
      - "supabase/**"

permissions:
  contents: write

jobs:
  sync-types:
    if: github.event.pull_request.head.ref == 'spec/cube-n-public-warranty-access'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database
        run: supabase db reset --local --no-seed

      - name: Generate canonical public database types
        run: |
          supabase gen types typescript --local --schema public > lib/supabase/database.types.ts
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'lib/supabase/database.types.ts';
          const content = fs.readFileSync(path, 'utf8').replace(/\n*$/, '\n');
          fs.writeFileSync(path, content);
          NODE

      - name: Commit generated types if changed
        run: |
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Generated types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "chore(db): sync generated public types"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
