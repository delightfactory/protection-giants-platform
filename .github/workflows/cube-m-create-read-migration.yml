name: Cube M Create Read Migration

"on":
  push:
    branches:
      - feature/cube-m-warranty-activation
    paths:
      - ".github/workflows/cube-m-create-read-migration.yml"

permissions:
  contents: write

jobs:
  scaffold:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-m-warranty-activation
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Discover migration command
        run: supabase migration new --help >/dev/null

      - name: Create migration through Supabase CLI
        run: supabase migration new cube_m_internal_warranty_read_layer

      - name: Commit generated migration only
        run: |
          git diff --exit-code -- . ':(exclude)supabase/migrations'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore(cube-m): scaffold internal Warranty read migration"
          git push origin HEAD:feature/cube-m-warranty-activation
