name: Temp Name Center Network Approval Stale Guard

on:
  push:
    branches:
      - feature/center-network-approval
    paths:
      - .github/workflows/temp-name-center-network-approval-stale-guard.yml

permissions:
  contents: read

jobs:
  name-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}
      - name: Generate migration name
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new center_network_approval_stale_guard
          find supabase/migrations -maxdepth 1 -type f -name '*_center_network_approval_stale_guard.sql' -printf '%f\n'
