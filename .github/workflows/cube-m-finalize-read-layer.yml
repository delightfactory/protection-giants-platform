name: Cube M Finalize Read Layer

"on":
  push:
    branches:
      - feature/cube-m-warranty-activation
    paths:
      - ".github/workflows/cube-m-finalize-read-layer.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-m-warranty-activation
          fetch-depth: 0

      - name: Fix lifecycle fixture to approved status
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-warranty-read-layer.mjs')
          text = path.read_text()
          old = "update public.installation_centers set status = 'inactive' where id = ${sqlUuid(centerB.id)};"
          new = "update public.installation_centers set status = 'suspended' where id = ${sqlUuid(centerB.id)};"
          if old not in text:
              raise SystemExit('Expected inactive fixture line was not found exactly once.')
          if text.count(old) != 1:
              raise SystemExit('Expected inactive fixture line was not unique.')
          path.write_text(text.replace(old, new))
          PY

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Generate exact public database types
        run: supabase gen types typescript --local --schema public > lib/supabase/database.types.ts

      - name: Verify only intended files changed
        run: |
          git diff --exit-code -- . \
            ':(exclude)scripts/verify-warranty-read-layer.mjs' \
            ':(exclude)lib/supabase/database.types.ts'
          git diff --check

      - name: Commit fixture and generated types
        run: |
          if git diff --quiet -- scripts/verify-warranty-read-layer.mjs lib/supabase/database.types.ts; then
            echo "Read-layer fixture and generated types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-warranty-read-layer.mjs lib/supabase/database.types.ts
          git commit -m "fix(cube-m): finalize Warranty read-layer contracts"
          git push origin HEAD:feature/cube-m-warranty-activation

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
