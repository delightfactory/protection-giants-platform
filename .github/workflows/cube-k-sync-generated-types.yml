name: Cube K Sync Generated Types

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/cube-k-sync-generated-types.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feature/cube-k-preinstall-issues' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start local Supabase and rebuild schema
        run: |
          supabase start
          supabase db reset --local --no-seed

      - name: Generate and commit canonical database types
        run: |
          supabase gen types typescript --local --schema public > /tmp/generated.database.types.ts
          git fetch origin "${{ github.head_ref }}"
          git reset --hard "origin/${{ github.head_ref }}"
          cp /tmp/generated.database.types.ts lib/supabase/database.types.ts
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Generated database types are already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "chore(db): sync generated Cube K types"
          git push origin HEAD:${{ github.head_ref }}

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
