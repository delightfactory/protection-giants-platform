name: Cube Q Regenerate Database Types Once

on:
  push:
    branches:
      - agent/cube-q-claim-review-inspection-decision

permissions:
  contents: write

jobs:
  regenerate-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Regenerate committed database types
        run: supabase gen types typescript --local > lib/supabase/database.types.ts

      - name: Commit exact generated types
        run: |
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Database types already match the schema."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "chore(db): regenerate types for cube q"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
