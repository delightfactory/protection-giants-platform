name: Cube L 5A 429 Retry Contract Fix

on:
  push:
    branches:
      - feature/cube-l-notifications-pwa
    paths:
      - ".github/workflows/cube-l-5a-429-contract-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-l-notifications-pwa
          fetch-depth: 0

      - name: Make provider 429 retryable only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20260823150000_cube_l_notification_push_worker_state.sql")
          text = migration.read_text()
          old_retry = """  if p_result = 'retryable_failure'\n    and p_http_status is not null\n    and (p_http_status < 500 or p_http_status > 599)\n  then"""
          new_retry = """  if p_result = 'retryable_failure'\n    and p_http_status is not null\n    and p_http_status <> 429\n    and (p_http_status < 500 or p_http_status > 599)\n  then"""
          if text.count(old_retry) != 1:
              raise SystemExit("retryable status contract target mismatch")
          text = text.replace(old_retry, new_retry)
          old_terminal = "or p_http_status in (404, 410)"
          new_terminal = "or p_http_status in (404, 410, 429)"
          if text.count(old_terminal) != 1:
              raise SystemExit("terminal status contract target mismatch")
          migration.write_text(text.replace(old_terminal, new_terminal))

          verifier = Path("scripts/verify-notification-push-worker-state.mjs")
          test = verifier.read_text()
          old = '  httpStatus: 503,\n  errorCode: "provider_5xx",'
          new = '  httpStatus: 429,\n  errorCode: "provider_rate_limited",'
          if test.count(old) != 2:
              raise SystemExit(f"expected two initial retry fixtures, found {test.count(old)}")
          verifier.write_text(test.replace(old, new))
          PY

          rm .github/workflows/cube-l-5a-429-contract-fix.yml
          node --check scripts/verify-notification-push-worker-state.mjs
          git diff --check

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cube-l-5a-429-contract-fix.yml' \
            'scripts/verify-notification-push-worker-state.mjs' \
            'supabase/migrations/20260823150000_cube_l_notification_push_worker_state.sql' | sort)"
          test "$actual" = "$expected"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cube-l): retry rate-limited push delivery"
          git push origin HEAD:feature/cube-l-notifications-pwa
