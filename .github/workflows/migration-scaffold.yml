name: Migration Scaffold

"on":
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/migration-scaffold.yml"

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Initialize local project
        run: supabase init --force

      - name: Start local database
        run: supabase db start

      - name: Generate database types
        run: |
          echo '---DATABASE_TYPES_START---'
          supabase gen types typescript --local
          echo '---DATABASE_TYPES_END---'

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
