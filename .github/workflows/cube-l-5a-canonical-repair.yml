name: Cube L 5A Canonical Repair

on:
  push:
    branches:
      - feature/cube-l-notifications-pwa
    paths:
      - ".github/workflows/cube-l-5a-canonical-repair.yml"

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-l-notifications-pwa
          fetch-depth: 0

      - name: Apply canonical generated types and verifier fixture fix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9497555718/zip" \
            > /tmp/generated-database-types.zip

          unzip -p /tmp/generated-database-types.zip generated.database.types.ts \
            > /tmp/generated.database.types.ts

          test "$(sha256sum /tmp/generated.database.types.ts | awk '{print $1}')" = \
            "80dcc2de9dd57b96d44da051ad5d22bc1287b64e85c209a5133528d67e00e491"

          cp /tmp/generated.database.types.ts lib/supabase/database.types.ts

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-notification-push-worker-state.mjs")
          text = path.read_text()
          old = "set next_attempt_at = now() - interval '1 second'"
          new = "set next_attempt_at = last_attempt_at"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one forceDue target, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/cube-l-5a-canonical-repair.yml

          node --check scripts/verify-notification-push-worker-state.mjs
          git diff --check

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/cube-l-5a-canonical-repair.yml' \
            'lib/supabase/database.types.ts' \
            'scripts/verify-notification-push-worker-state.mjs' | sort)"
          test "$actual" = "$expected"

          test "$(sha256sum lib/supabase/database.types.ts | awk '{print $1}')" = \
            "80dcc2de9dd57b96d44da051ad5d22bc1287b64e85c209a5133528d67e00e491"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cube-l): close push worker state gate"
          git push origin HEAD:feature/cube-l-notifications-pwa
