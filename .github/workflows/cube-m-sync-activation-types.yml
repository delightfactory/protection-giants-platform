name: Cube M Sync Activation Types

"on":
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/cube-m-sync-activation-types.yml"

permissions:
  contents: write

jobs:
  sync-types:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-m-warranty-activation
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Start fresh local Supabase stack
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Generate exact public database types
        run: supabase gen types typescript --local --schema public > lib/supabase/database.types.ts

      - name: Commit generated type change only
        run: |
          git diff --exit-code -- . ':(exclude)lib/supabase/database.types.ts'
          if git diff --quiet -- lib/supabase/database.types.ts; then
            echo "Generated public database types are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/supabase/database.types.ts
          git commit -m "chore(cube-m): regenerate activation database types"
          git push origin HEAD:feature/cube-m-warranty-activation

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup
