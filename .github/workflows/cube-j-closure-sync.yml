name: Cube J Closure Sync

on:
  push:
    branches:
      - feature/cube-j-roll-opening-claiming
    paths:
      - "scripts/cube-j-closure-sync.mjs"
      - ".github/workflows/cube-j-closure-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-j-roll-opening-claiming
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
          github-token: ${{ github.token }}

      - name: Apply deterministic Transfer Send closure patch
        run: node scripts/cube-j-closure-sync.mjs

      - name: Start local Supabase
        run: supabase start

      - name: Generate canonical database types
        run: supabase gen types typescript --local --schema public > lib/supabase/database.types.ts

      - name: Commit closure outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/transfers/transfer-send-flow.tsx lib/supabase/database.types.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(cube-j): close transfer UX and generated types"
          git push origin HEAD:feature/cube-j-roll-opening-claiming

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
