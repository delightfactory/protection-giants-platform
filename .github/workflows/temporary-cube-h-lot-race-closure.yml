name: Temporary Cube H Lot Race Closure

on:
  push:
    branches:
      - feature/cube-h-transfer-receipt-resolution

permissions:
  contents: write

jobs:
  close-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-h-transfer-receipt-resolution

      - name: Patch Lot selection race
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/transfers/transfer-receipt-flow.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { getSupabaseBrowserClient } from "@/lib/supabase/client";\n',
              'import { getSupabaseBrowserClient } from "@/lib/supabase/client";\nimport { MAX_TRANSFER_RECEIPT_ROLLS, planReceiptLotSelection } from "@/lib/transfers/receipt-selection";\n',
          )
          replace_once('const MAX_ROLLS = 10000;\n', '')
          replace_once(
              'type LotSelectionConfirmation = {\n  lot: ReceiptLotExpansion;\n  additions: string[];\n};\n',
              'type LotSelectionConfirmation = {\n  lot: ReceiptLotExpansion;\n};\n',
          )
          text = text.replace('MAX_ROLLS', 'MAX_TRANSFER_RECEIPT_ROLLS')
          replace_once(
              '  const finalReceipt = selectedCount > 0 && selectedCount === detail.pending_count;\n',
              '  const finalReceipt = selectedCount > 0 && selectedCount === detail.pending_count;\n  const lotSelectionPlan = useMemo(\n    () => lotConfirmation\n      ? planReceiptLotSelection(selected, lotConfirmation.lot.pending_roll_ids)\n      : null,\n    [lotConfirmation, selected],\n  );\n',
          )
          replace_once(
              '          setSelected(new Set(valid));\n',
              '          const restored = new Set(valid);\n          selectionRef.current = restored;\n          setSelected(restored);\n',
          )
          replace_once(
              '    setSelected((current) => new Set(current).add(row.roll_id));\n',
              '    const nextSelection = new Set(selectionRef.current);\n    nextSelection.add(row.roll_id);\n    selectionRef.current = nextSelection;\n    setSelected(nextSelection);\n',
          )
          replace_once(
              '''    setSelected((current) => {
      const next = new Set(current);
      if (next.has(row.roll_id)) next.delete(row.roll_id);
      else if (next.size < MAX_TRANSFER_RECEIPT_ROLLS) next.add(row.roll_id);
      return next;
    });
''',
              '''    const nextSelection = new Set(selectionRef.current);
    const wasSelected = nextSelection.has(row.roll_id);
    if (wasSelected) nextSelection.delete(row.roll_id);
    else if (nextSelection.size < MAX_TRANSFER_RECEIPT_ROLLS) nextSelection.add(row.roll_id);
    selectionRef.current = nextSelection;
    setSelected(nextSelection);
''',
          )
          replace_once(
              '      if (selected.has(row.roll_id)) next.delete(row.roll_id);\n',
              '      if (wasSelected) next.delete(row.roll_id);\n',
          )
          replace_once(
              '''  async function addLot(lotId: string) {
    setLoading(true);
    setFeedback(null);
    try {
      const { data, error } = await supabase.rpc("expand_roll_transfer_receipt_lot", {
        p_transfer_id: detail.transfer_id,
        p_lot_id: lotId,
      });
      if (error || !Array.isArray(data) || data.length !== 1) throw new Error(error?.message ?? "lot");
      const lot = data[0] as ReceiptLotExpansion;
      const room = MAX_TRANSFER_RECEIPT_ROLLS - selectionRef.current.size;
      const additions = lot.pending_roll_ids.filter((id) => !selectionRef.current.has(id)).slice(0, room);
      if (additions.length === 0) {
        setFeedback({ tone: "info", text: `لا توجد لفات جديدة معلقة لإضافتها من Lot ${lot.lot_number}.` });
        return;
      }
      setLotConfirmation({ lot, additions });
    } catch {
      setFeedback({ tone: "error", text: "تعذر تحديث مجموعة Lot. حدّث التحويل ثم أعد المحاولة." });
    } finally {
      setLoading(false);
    }
  }

  function confirmLotSelection() {
    if (!lotConfirmation) return;
    const { lot, additions } = lotConfirmation;
    setSelected((current) => {
      const next = new Set(current);
      additions.forEach((id) => next.add(id));
      return next;
    });
    setSelectionDetails((current) => {
      const next = new Map(current);
      additions.forEach((rollId) => next.set(rollId, {
        roll_id: rollId,
        serial_number: "",
        lot_id: lot.lot_id,
        lot_number: lot.lot_number,
        product_name: lot.product_name,
      }));
      return next;
    });
    setLotConfirmation(null);
    setFeedback({
      tone: "success",
      text: lot.transfer_contains_full_lot
        ? `تم تحديد ${additions.length} لفة معلقة من Lot ${lot.lot_number}.`
        : `التحويل يحتوي جزءًا فقط من Lot ${lot.lot_number}. تم تحديد ${additions.length} لفة معلقة داخل التحويل فقط.`,
    });
  }
''',
              '''  async function addLot(lotId: string) {
    if (!draftHydrated) {
      setFeedback({ tone: "info", text: "جارٍ استعادة اختيار الاستلام السابق. أكمل بعد انتهاء الاستعادة." });
      return;
    }
    setLoading(true);
    setFeedback(null);
    try {
      const { data, error } = await supabase.rpc("expand_roll_transfer_receipt_lot", {
        p_transfer_id: detail.transfer_id,
        p_lot_id: lotId,
      });
      if (error || !Array.isArray(data) || data.length !== 1) throw new Error(error?.message ?? "lot");
      const lot = data[0] as ReceiptLotExpansion;
      const plan = planReceiptLotSelection(selectionRef.current, lot.pending_roll_ids);
      if (plan.additions.length === 0) {
        setFeedback({ tone: "info", text: `لا توجد لفات جديدة معلقة لإضافتها من Lot ${lot.lot_number}.` });
        return;
      }
      setLotConfirmation({ lot });
    } catch {
      setFeedback({ tone: "error", text: "تعذر تحديث مجموعة Lot. حدّث التحويل ثم أعد المحاولة." });
    } finally {
      setLoading(false);
    }
  }

  function confirmLotSelection() {
    if (!lotConfirmation || !draftHydrated) return;
    const { lot } = lotConfirmation;
    const plan = planReceiptLotSelection(selectionRef.current, lot.pending_roll_ids);
    const additions = plan.additions;
    if (additions.length === 0) {
      setLotConfirmation(null);
      setFeedback({ tone: "info", text: `لم تعد هناك لفات جديدة قابلة للإضافة من Lot ${lot.lot_number}.` });
      return;
    }

    selectionRef.current = plan.next;
    setSelected(plan.next);
    setSelectionDetails((current) => {
      const next = new Map(current);
      additions.forEach((rollId) => next.set(rollId, {
        roll_id: rollId,
        serial_number: "",
        lot_id: lot.lot_id,
        lot_number: lot.lot_number,
        product_name: lot.product_name,
      }));
      return next;
    });
    setLotConfirmation(null);
    setFeedback({
      tone: "success",
      text: lot.transfer_contains_full_lot
        ? `تم تحديد ${additions.length} لفة معلقة من Lot ${lot.lot_number}.`
        : `التحويل يحتوي جزءًا فقط من Lot ${lot.lot_number}. تم تحديد ${additions.length} لفة معلقة داخل التحويل فقط.`,
    });
  }
''',
          )
          replace_once(
              '<button type="button" className={styles.mode} data-active={mode === "lots"} onClick={() => setMode("lots")}>\n              <strong>تأكيد مجموعة Lot</strong><span>للحركة الكبيرة الموثوقة</span>\n            </button>',
              '<button type="button" className={styles.mode} data-active={mode === "lots"} onClick={() => setMode("lots")} disabled={!draftHydrated}>\n              <strong>تأكيد مجموعة Lot</strong><span>{draftHydrated ? "للحركة الكبيرة الموثوقة" : "جارٍ استعادة الاختيار السابق…"}</span>\n            </button>',
          )
          replace_once(
              '<button type="button" className="button button-ghost" onClick={() => void addLot(lot.lot_id)} disabled={loading || lot.pending_count === 0}>\n                          {lot.pending_count === 0 ? "لا يوجد متبقي" : `مراجعة تحديد ${lot.pending_count}`}\n                        </button>',
              '<button type="button" className="button button-ghost" onClick={() => void addLot(lot.lot_id)} disabled={!draftHydrated || loading || lot.pending_count === 0}>\n                          {!draftHydrated ? "جارٍ الاستعادة…" : lot.pending_count === 0 ? "لا يوجد متبقي" : `مراجعة تحديد ${lot.pending_count}`}\n                        </button>',
          )
          replace_once('{lotConfirmation ? (\n', '{lotConfirmation && lotSelectionPlan ? (\n')
          text = text.replace('lotConfirmation.additions.length', 'lotSelectionPlan.additions.length')
          replace_once(
              '<button type="button" className="button button-primary" onClick={confirmLotSelection}>نعم، أضف {lotSelectionPlan.additions.length} لفة</button>',
              '<button type="button" className="button button-primary" onClick={confirmLotSelection} disabled={!draftHydrated || lotSelectionPlan.additions.length === 0}>نعم، أضف {lotSelectionPlan.additions.length} لفة</button>',
          )

          path.write_text(text)
          PY

          git diff --check -- components/transfers/transfer-receipt-flow.tsx

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused behavioral test
        run: npx vitest run scripts/verify-transfer-receipt-interactions.test.mjs --config vitest.config.mjs

      - name: Type check
        run: npm run typecheck

      - name: Commit closure patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            components/transfers/transfer-receipt-flow.tsx \
            package-lock.json
          if git diff --cached --quiet; then
            echo "Closure patch already applied."
            exit 0
          fi
          git commit -m "fix(transfers): close Lot hydration race"
          git push origin HEAD:feature/cube-h-transfer-receipt-resolution
