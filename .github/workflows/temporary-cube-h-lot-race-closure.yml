name: Temporary Cube H Lot Race Closure

on:
  push:
    branches:
      - feature/cube-h-transfer-receipt-resolution

permissions:
  contents: write

jobs:
  close-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/cube-h-transfer-receipt-resolution

      - name: Patch Lot selection race
        run: |
          python scripts/temporary-cube-h-lot-race-closure.py
          git diff --check -- components/transfers/transfer-receipt-flow.tsx

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run focused behavioral test
        run: npx vitest run scripts/verify-transfer-receipt-interactions.test.mjs --config vitest.config.mjs

      - name: Type check
        run: npm run typecheck

      - name: Commit closure patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            components/transfers/transfer-receipt-flow.tsx \
            package-lock.json
          if git diff --cached --quiet; then
            echo "Closure patch already applied."
            exit 0
          fi
          git commit -m "fix(transfers): close Lot hydration race"
          git push origin HEAD:feature/cube-h-transfer-receipt-resolution
