name: UX A11Y 01 test fixture patch

on:
  push:
    branches:
      - agent/ux-a11y-01-accessible-dialog-sheet
    paths:
      - .github/workflows/ux-a11y-01-test-fixture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-a11y-01-accessible-dialog-sheet

      - name: Adapt non-DOM interaction fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-transfer-receipt-interactions.test.mjs")
          text = path.read_text()
          needle = '''vi.mock("@/components/transfers/qr-scanner-sheet", () => ({\n  QrScannerSheet: () => null,\n}));\n\n'''
          replacement = needle + '''vi.mock("@/components/ui/accessible-dialog", async () => {\n  const ReactModule = await vi.importActual("react");\n  return {\n    AccessibleDialog: ({ children }) => ReactModule.createElement(ReactModule.Fragment, null, children),\n  };\n});\n\n'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f"Expected exactly one QR scanner mock anchor, found {count}.")
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit fixture compatibility update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-transfer-receipt-interactions.test.mjs
          git diff --cached --check
          git commit -m "test(ux-a11y-01): isolate native dialog from interaction harness"
          git push origin HEAD:agent/ux-a11y-01-accessible-dialog-sheet
